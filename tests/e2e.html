<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FamTee end-to-end</title>
</head>
<body>
<pre id="results">running…</pre>
<iframe id="app" width="1200" height="800" title="app"></iframe>
<script type="module">
// End-to-end: drive the built single-file app in an iframe (served over http so it is
// same-origin), edit through its real UI, save, reopen the saved file, save again.
// Run by tests/run.py with ?app=<built html>&report=<url>.
import { test, assert, assertEqual, run } from './harness.js';

const params = new URLSearchParams(location.search);
const frame = document.getElementById('app');
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// Loads the app in the iframe and answers the start screen (ADR 0017) with `start`:
// 'start-file' (the family in this file), 'start-continue' or 'start-new'.
async function load(props, start = 'start-file') {
  const loaded = new Promise((resolve) => { frame.onload = resolve; });
  frame.removeAttribute('srcdoc');
  Object.assign(frame, props);
  await loaded;
  const win = frame.contentWindow;
  for (let i = 0; i < 100 && !win.famtee && !win.document.querySelector('.start-overlay'); i++) await sleep(20);
  const card = win.document.querySelector(`.start-choice[data-choice="${start}"]`);
  assert(win.famtee || card, `start screen offers ${start}`);
  card?.querySelector('button:not(.link)').click();
  for (let i = 0; i < 100 && !win.famtee; i++) await sleep(20);
  assert(win.famtee, 'app booted');
  return { win, doc: win.document, app: win.famtee };
}

// Downloads are the only way the app writes files: capture them instead of saving.
function captureDownloads(win) {
  const saved = [];
  let blob = null;
  win.URL.createObjectURL = (b) => { blob = b; return 'blob:captured'; };
  win.URL.revokeObjectURL = () => {};
  win.HTMLAnchorElement.prototype.click = function capture() { saved.push({ name: this.download, blob }); };
  return saved;
}
const textOf = (download) => download.blob.text();

const byText = (doc, text) => [...doc.querySelectorAll('button')].find((b) => b.textContent === text);
const change = (el, value) => { el.value = value; el.dispatchEvent(new Event('change')); };
const fingerprint = (html) => JSON.parse(new DOMParser().parseFromString(html, 'text/html')
  .getElementById('famtee-data').textContent).meta.revision;
let savedHtml;
let editedDoc;

test('edit, download a stamped file, reopen it, download again', async () => {
  let { win, doc, app } = await load({ src: params.get('app') });
  win.localStorage.clear();
  app.ctx.select('p-peter');
  change(doc.querySelector('[name="given"]'), 'Pierre');
  byText(doc, '+ Child').click();
  const [child] = app.view.selection;
  change(doc.querySelector('[name="given"]'), 'Baby');
  assert([...doc.querySelectorAll('.layer-labels .name')].some((t) => t.textContent === 'Pierre Hanna'), 'canvas shows edit');
  assert(doc.querySelector('.save-state').textContent.includes('not downloaded'));

  const saved = captureDownloads(win);
  byText(doc, 'Download').click();
  assertEqual(saved.length, 1);
  assert(doc.querySelector('.save-state').textContent.startsWith('Downloaded '));
  savedHtml = await textOf(saved[0]);
  const rev = fingerprint(savedHtml);
  assert(/^[0-9a-f]{64}$/.test(rev.hash) && rev.parent === null, 'first download: hash, no parent');
  assert(new RegExp(`^hanna-family-extended-sample-\\d{4}-\\d{2}-\\d{2}-\\d{6}-${rev.hash.slice(0, 6)}\\.html$`).test(saved[0].name), saved[0].name);
  editedDoc = JSON.parse(JSON.stringify(app.store.doc));
  assertEqual(editedDoc.meta.revision, rev);
  assert(!savedHtml.includes('class="card'), 'downloaded file has no rendered output baked in');

  ({ win, doc, app } = await load({ srcdoc: savedHtml }));
  assertEqual(app.store.doc, editedDoc);
  assertEqual(app.store.doc.graphs['g-hanna'].nodes[child].attrs.name.given, 'Baby');
  assert(!app.store.dirty);
  assert(doc.getElementById('notice').hidden, 'fingerprint matches: no warning');

  const again = captureDownloads(win);
  app.download('html');
  const rev2 = fingerprint(await textOf(again[0]));
  assertEqual(rev2.hash, rev.hash, 'same content, same fingerprint');
  assertEqual(rev2.parent, rev.hash, 'chained to the version it was opened from');
});

test('unsaved work is kept in the browser and offered on the start screen', async () => {
  let { win, doc, app } = await load({ srcdoc: savedHtml });
  app.ctx.select('p-mary');
  change(doc.querySelector('[name="surname"]'), 'Draftly');
  await sleep(1300); // kept in the browser ~1 s after the change
  assert(doc.querySelector('.save-state').textContent.startsWith('Kept in this browser'));
  ({ win, doc, app } = await load({ srcdoc: savedHtml }, 'start-continue'));
  assertEqual(app.store.doc.graphs['g-hanna'].nodes['p-mary'].attrs.name.surname, 'Draftly');
  assert(app.store.dirty, 'continued work still needs downloading');

  ({ win, doc, app } = await load({ srcdoc: savedHtml }));
  assertEqual(app.store.doc, editedDoc, 'opening the file instead gives the file’s version');
  win.localStorage.clear();
});

test('a file edited outside FamTee is flagged', async () => {
  const tampered = savedHtml.replace('"Pierre"', '"Peter"');
  const { doc } = await load({ srcdoc: tampered });
  assert(doc.getElementById('notice').textContent.includes('changed outside FamTee'));
});

test('export FamTee data and open it again', async () => {
  const { win, doc, app } = await load({ srcdoc: savedHtml });
  const saved = captureDownloads(win);
  byText(doc, 'Export ▾').click();
  byText(doc, 'FamTee data (.famtee.json)').click();
  const json = await textOf(saved[0]);
  assert(saved[0].name.endsWith('.famtee.json'));
  const exported = JSON.parse(json);
  assertEqual(exported.graphs, editedDoc.graphs);

  app.store.apply('wipe', (d) => { d.meta.title = 'Changed'; });
  const file = new win.File([json], saved[0].name, { type: 'application/json' });
  const input = doc.querySelector('.toolbar input[type="file"]');
  const transfer = new win.DataTransfer();
  transfer.items.add(file);
  input.files = transfer.files;
  input.dispatchEvent(new win.Event('change'));
  await sleep(200);
  assertEqual(app.store.doc.meta.title, editedDoc.meta.title);
  app.store.undo();
  assertEqual(app.store.doc.meta.title, 'Changed', 'Open… is undoable');
});

test('start screen: a new tree', async () => {
  const { doc, app } = await load({ srcdoc: savedHtml }, 'start-new');
  assertEqual(app.store.doc.meta.title, 'My family');
  assertEqual(Object.keys(app.store.doc.graphs[app.store.doc.meta.rootGraph].nodes).length, 0);
  byText(doc, '+ Person').click();
  assertEqual(doc.querySelectorAll('.card.person').length, 1);
});

test('drag moves a card (undoably); pan and zoom never touch the document', async () => {
  const { win, doc, app } = await load({ srcdoc: savedHtml });
  const svg = doc.getElementById('canvas');
  const fire = (type, target, x, y) => target.dispatchEvent(new win.PointerEvent(type, {
    bubbles: true, cancelable: true, pointerId: 1, pointerType: 'mouse', button: 0, clientX: x, clientY: y,
  }));
  const cardX = () => Number(doc.querySelector('rect.card[data-id="p-leo"]').getAttribute('x'));
  const k = app.getTransform().k;
  const x0 = cardX();
  const r = doc.querySelector('rect.card[data-id="p-leo"]').getBoundingClientRect();
  const [cx, cy] = [r.left + r.width / 2, r.top + r.height / 2];

  fire('pointerdown', doc.querySelector('rect.card[data-id="p-leo"]'), cx, cy);
  fire('pointermove', svg, cx + 30, cy);
  fire('pointermove', svg, cx + 60, cy);
  assert(doc.querySelector('rect.card.dragging'), 'live preview while dragging');
  assert(!app.store.dirty, 'nothing stored until drop');
  fire('pointerup', svg, cx + 60, cy);
  const nudge = app.store.doc.graphs['g-hanna'].nodes['p-leo'].attrs.nudge;
  assertEqual(nudge, { dx: Math.round(60 / k), dy: 0 });
  assert(Math.abs(cardX() - x0 - 60 / k) <= 1, 'card drawn at the new place');
  assertEqual(app.store.undoStack.at(-1).label, 'Move person');
  assertEqual(app.view.selection.size, 0, 'drop does not select');
  app.store.undo();
  assertEqual(cardX(), x0);

  const t1 = app.getTransform();
  const undoDepth = app.store.undoStack.length;
  const sr = svg.getBoundingClientRect();
  fire('pointerdown', svg, sr.left + 5, sr.top + 5);
  fire('pointermove', svg, sr.left + 45, sr.top + 25);
  fire('pointerup', svg, sr.left + 45, sr.top + 25);
  assertEqual(app.getTransform(), { ...t1, x: t1.x + 40, y: t1.y + 20 });
  assertEqual(app.store.undoStack.length, undoDepth, 'panning is not an edit');

  byText(doc, '+').click();
  assert(Math.abs(app.getTransform().k - t1.k * 1.25) < 1e-9);
  const zoomed = app.getTransform();
  app.ctx.select('p-leo');
  change(doc.querySelector('[name="surname"]'), 'Moved');
  assertEqual(app.getTransform(), zoomed, 'view kept across edits');
  byText(doc, 'Fit').click();
  assertEqual(app.getTransform(), t1, 'Fit returns to the initial fitted view');
});

test('copy a person into a sub-graph, follow the badge there and back; group via the panel', async () => {
  const { win, doc, app } = await load({ srcdoc: savedHtml });
  byText(doc, '+ Sub-graph').click();
  const sub = app.view.path.at(-1);
  assertEqual(app.store.doc.graphs[sub].title, 'New family');
  doc.querySelector('#breadcrumb button').click();
  app.ctx.select('p-nadia');
  const graphSelect = doc.querySelector('[name="link-graph"]');
  change(graphSelect, sub);
  byText(doc, 'Copy into that graph').click();
  assertEqual(Object.keys(app.store.doc.graphs[sub].nodes).length, 1, 'the new graph now holds the copy');

  const badge = doc.querySelector('.link-badge');
  assert(badge, 'badge on the original card');
  badge.dispatchEvent(new win.MouseEvent('click', { bubbles: true }));
  assertEqual(app.view.path.at(-1), sub, 'badge opens the other graph');
  const [copy] = app.view.selection;
  assertEqual(app.store.doc.graphs[sub].nodes[copy].attrs.name.given, 'Nadia');
  doc.querySelector('.link-badge').dispatchEvent(new win.MouseEvent('click', { bubbles: true }));
  assertEqual([app.view.path.at(-1), [...app.view.selection][0]], ['g-hanna', 'p-nadia'], 'and back');

  byText(doc, 'Add to group').click();
  app.ctx.select('p-peter');
  byText(doc, 'Add to group').click();
  const groups = Object.values(app.store.doc.graphs['g-hanna'].nodes).filter((n) => n.type === 'group');
  assertEqual(groups.map((n) => n.attrs.members), [['p-nadia', 'p-peter']], 'joined the existing group');
  const hull = doc.querySelector('rect.group');
  assert(hull, 'group drawn');
  hull.dispatchEvent(new win.MouseEvent('click', { bubbles: true }));
  assertEqual(doc.querySelector('#panel h2').textContent, 'Group');
  app.store.undo();
  app.store.undo();
  assert(!doc.querySelector('rect.group'), 'undo removes the group');
});

test('GEDCOM: export the graph, import it back as a new graph, undo', async () => {
  const { win, doc, app } = await load({ srcdoc: savedHtml });
  app.store.apply('dirty', (d) => { d.meta.title = 'Unsaved title'; });
  const count = Object.values(app.store.doc.graphs['g-hanna'].nodes).filter((n) => n.type === 'person').length;
  const saved = captureDownloads(win);
  byText(doc, 'Export ▾').click();
  byText(doc, 'GEDCOM (.ged)').click();
  assertEqual(saved.length, 1);
  const ged = await textOf(saved[0]);
  assert(ged.startsWith('0 HEAD\r\n') && ged.trimEnd().endsWith('0 TRLR'));
  assertEqual((ged.match(/^0 @I\d+@ INDI/gm) ?? []).length, count);
  assert(app.store.dirty, 'a GEDCOM export does not count as saving');
  assert(doc.getElementById('notice').textContent.includes(`${count} people`));

  const graphsBefore = Object.keys(app.store.doc.graphs).length;
  app.ctx.select(null);
  const input = doc.querySelector('[name="gedcom-subgraph"]'); // Advanced → Add GEDCOM as sub-graph…
  const transfer = new win.DataTransfer();
  transfer.items.add(new win.File([ged], 'hanna.ged', { type: 'application/x-gedcom' }));
  input.files = transfer.files;
  input.dispatchEvent(new win.Event('change'));
  await sleep(300);
  const graphId = app.view.path.at(-1);
  assert(graphId !== 'g-hanna', 'opened the imported graph');
  assertEqual(app.store.doc.graphs[graphId].title, 'hanna');
  const names = (g) => Object.values(app.store.doc.graphs[g].nodes).filter((n) => n.type === 'person')
    .map((n) => `${n.attrs.name?.given} ${n.attrs.name?.surname}`).sort();
  assertEqual(names(graphId), names('g-hanna'));
  assertEqual(doc.querySelectorAll('.card.person').length, count, 'imported graph is drawn');
  assert(Object.values(app.store.doc.graphs['g-hanna'].nodes).some((n) => n.type === 'graphRef' && n.attrs.graph === graphId),
    'tile added to the graph it was imported from');
  app.store.undo();
  assertEqual(Object.keys(app.store.doc.graphs).length, graphsBefore);
  assertEqual(app.view.path.at(-1), 'g-hanna', 'view returns when the graph disappears');
});

test('GEDCOM merged: a person copied into a sub-graph is written once', async () => {
  const { win, doc, app } = await load({ srcdoc: savedHtml });
  const people = Object.values(app.store.doc.graphs['g-hanna'].nodes).filter((n) => n.type === 'person').length;
  byText(doc, '+ Sub-graph').click();
  doc.querySelector('#breadcrumb button').click();
  app.ctx.select('p-nadia');
  change(doc.querySelector('[name="link-graph"]'), Object.keys(app.store.doc.graphs).find((g) => g !== 'g-hanna'));
  byText(doc, 'Copy into that graph').click();

  const saved = captureDownloads(win);
  byText(doc, 'Export ▾').click();
  assert(!byText(doc, 'GEDCOM: all graphs merged').hidden, 'offered now that two graphs have people');
  byText(doc, 'GEDCOM: all graphs merged').click();
  assertEqual(saved.length, 1);
  assertEqual(((await textOf(saved[0])).match(/^0 @I\d+@ INDI/gm) ?? []).length, people, 'Nadia once, not twice');
  const notice = doc.getElementById('notice').textContent;
  assert(notice.includes(`${people} people`) && notice.includes('2 graph(s) merged'), notice);
  assert(doc.querySelector('.menu').hidden, 'menu closed after choosing');
});

test('photos: add and replace in the built app; saved file holds only the current one', async () => {
  let { win, doc, app } = await load({ srcdoc: savedHtml });
  const imageFile = async (color, name) => {
    const canvas = Object.assign(doc.createElement('canvas'), { width: 800, height: 600 });
    const g = canvas.getContext('2d');
    g.fillStyle = color;
    g.fillRect(0, 0, 800, 600);
    const blob = await new Promise((r) => canvas.toBlob(r, 'image/png'));
    return new win.File([blob], name, { type: 'image/png' });
  };
  const pick = async (file) => {
    const input = doc.querySelector('[name="photo-file"]');
    const transfer = new win.DataTransfer();
    transfer.items.add(file);
    input.files = transfer.files;
    input.dispatchEvent(new win.Event('change'));
    await sleep(300);
  };
  app.ctx.select('p-mary');
  await pick(await imageFile('#36c', 'mary.png'));
  await pick(await imageFile('#c63', 'mary2.png'));
  assert(doc.querySelector('.avatar[data-id="p-mary"]'), 'avatar drawn on the card');

  const saved = captureDownloads(win);
  byText(doc, 'Download').click();
  const html = await textOf(saved[0]);
  const media = JSON.parse(new DOMParser().parseFromString(html, 'text/html')
    .getElementById('famtee-data').textContent).media;
  assertEqual(Object.keys(media).length, 1, 'the replaced photo is not saved');
  assert(Object.values(media)[0].data.length < 40000, 'photo is small (shrunk to 256 px)');

  ({ win, doc, app } = await load({ srcdoc: html }));
  assert(doc.querySelector('.avatar[data-id="p-mary"]'), 'photo still there after reopening');
  assert(doc.querySelector('defs pattern image').getAttribute('href').startsWith('data:image/jpeg;base64,'));
});

test('privacy: a shared copy hides living people and leaves the family untouched', async () => {
  const { win, doc, app } = await load({ srcdoc: savedHtml });
  app.ctx.select('p-george');
  assertEqual(doc.querySelector('[name="status"]').value, '', 'automatic by default');
  change(doc.querySelector('[name="status"]'), 'deceased');
  assertEqual(app.store.doc.graphs['g-hanna'].nodes['p-george'].attrs.status, 'deceased');
  const before = JSON.stringify(app.store.doc);
  const dirty = app.store.dirty;

  const saved = captureDownloads(win);
  byText(doc, 'Export ▾').click();
  byText(doc, 'Share copy without living people (.html)').click();
  assertEqual(saved.length, 1);
  assert(/-shared-\d{4}-\d{2}-\d{2}-\d{6}-[0-9a-f]{6}\.html$/.test(saved[0].name), saved[0].name);
  const shared = JSON.parse(new DOMParser().parseFromString(await textOf(saved[0]), 'text/html')
    .getElementById('famtee-data').textContent);
  const people = Object.values(shared.graphs['g-hanna'].nodes).filter((n) => n.type === 'person');
  const living = people.filter((n) => n.attrs.name?.given === 'Living');
  assert(living.length > 0 && living.every((n) => !n.attrs.birth && !n.attrs.notes && !n.attrs.photo));
  assert(people.some((n) => n.attrs.name?.given === 'George'), 'deceased people stay named');
  for (const name of ['Baby', 'Rami']) assert(!JSON.stringify(shared).includes(name), `living ${name} is not in the copy`);
  assert(JSON.stringify(shared).includes('Pierre'), 'Pierre died in 2019: kept');
  assert(shared.meta.id !== app.store.doc.meta.id);
  assertEqual(JSON.stringify(app.store.doc), before, 'family untouched');
  assertEqual(app.store.dirty, dirty, 'sharing is not saving');
  assert(doc.getElementById('notice').textContent.includes('shown as “Living”'));
});

test('layout: switch to left to right; a card dropped on a neighbour pushes it aside', async () => {
  const { win, doc, app } = await load({ srcdoc: savedHtml });
  const card = (id) => doc.querySelector(`rect.card[data-id="${id}"]`);
  const box = (id) => ({ x: +card(id).getAttribute('x'), y: +card(id).getAttribute('y'), w: +card(id).getAttribute('width'), h: +card(id).getAttribute('height') });
  const overlaps = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;

  // Drag Leo onto Zoe (siblings): Zoe must move out of the way.
  const [leo, zoe] = [box('p-leo'), box('p-zoe')];
  const k = app.getTransform().k;
  const r = card('p-leo').getBoundingClientRect();
  const fire = (type, target, x, y) => target.dispatchEvent(new win.PointerEvent(type, {
    bubbles: true, cancelable: true, pointerId: 1, pointerType: 'mouse', button: 0, clientX: x, clientY: y,
  }));
  const [cx, cy] = [r.left + r.width / 2, r.top + r.height / 2];
  fire('pointerdown', card('p-leo'), cx, cy);
  fire('pointermove', doc.getElementById('canvas'), cx + 20, cy);
  fire('pointermove', doc.getElementById('canvas'), cx + (zoe.x - leo.x) * k, cy);
  fire('pointerup', doc.getElementById('canvas'), cx + (zoe.x - leo.x) * k, cy);
  assert(Math.abs(box('p-leo').x - zoe.x) <= 1, 'Leo is where he was dropped');
  assert(!overlaps(box('p-leo'), box('p-zoe')), 'Zoe was pushed aside');
  assert(!app.store.doc.graphs['g-hanna'].nodes['p-zoe'].attrs.nudge, 'Zoe herself was not moved by the user');

  change(doc.querySelector('[name="orientation"]'), 'LR');
  const george = box('p-george');
  assert(box('p-peter').x > george.x + george.w, 'next generation is to the right');
  const all = [...doc.querySelectorAll('rect.card.person')].map((c) => box(c.dataset.id));
  for (let i = 0; i < all.length; i++) for (let j = i + 1; j < all.length; j++) assert(!overlaps(all[i], all[j]), 'no overlaps left to right');
  app.store.undo();
  const georgeTB = box('p-george');
  assert(box('p-peter').y > georgeTB.y + georgeTB.h, 'undo: back to top to bottom');
});

run();
</script>
</body>
</html>
