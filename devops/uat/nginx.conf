# UAT web server (ADR 0016): serves the deployed release read-only.
# /srv/uat/current is a relative symlink switched atomically by devops/uat.sh deploy.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /srv/uat/current;
    index index.html;
    autoindex off;
    disable_symlinks off;

    # Testers must always see the deployed release, never a cached older one.
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # SHA256SUMS and ci.log have no registered type: show them as text, don't download.
    default_type text/plain;
    charset utf-8;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
