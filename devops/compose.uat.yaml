# UAT environment (ADR 0016): a read-only web server for the deployed release,
# reachable on the local network. Managed by devops/uat.sh; deployed by devops/merge.sh.
name: famtee-uat

services:
  uat:
    image: nginxinc/nginx-unprivileged:1.28-alpine
    ports:
      - "${FAMTEE_UAT_BIND:-0.0.0.0}:${FAMTEE_UAT_PORT:-8080}:8080"
    volumes:
      - type: bind # deployed sites; only devops/uat.sh writes here
        source: ../.uat
        target: /srv/uat
        read_only: true
      - type: bind
        source: ./uat/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:size=16m
      - /var/cache/nginx:size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
